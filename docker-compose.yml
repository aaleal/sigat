services:
  sigat:
    build: .
    container_name: sigat-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=sigat-super-secret-change-me
      # --- HTTPS (escolher uma opção) ---
      # a) TLS terminado por um proxy/balanceador à frente da app:
      # - TRUST_PROXY=1
      # - FORCE_HTTPS=1
      # b) TLS na própria app (montar os ficheiros em /certs):
      # - SSL_KEY_FILE=/certs/privkey.pem
      # - SSL_CERT_FILE=/certs/fullchain.pem
      # --- Cópias de segurança: usar um volume/servidor diferente de ./data ---
      # - SIGAT_BACKUP_DIR=/backups
      # --- Origens CORS permitidas (por omissão: nenhuma, o frontend é servido pela app) ---
      # - CORS_ORIGENS=https://sigat.exemplo.pt
      # --- SSO por proxy de autenticação (IIS/Windows, oauth2-proxy, Easy Auth) ---
      # - SSO_HEADER=X-Remote-User
      # - SSO_SEGREDO=<segredo-partilhado-com-o-proxy-min-16-caracteres>
      # - SSO_ROLE_POR_OMISSAO=read   # vazio = só contas já criadas
      # - SSO_REMOVER_DOMINIO=1       # DOMINIO\user ou user@dominio -> user
    volumes:
      - ./data:/app/data
      # - ./backups:/backups
    # Podman rootless: mapear o utilizador "node" (1000) para o dono de ./data no anfitrião (ignorado pelo Docker)
    x-podman.uidmaps: ["0:1:1000", "1000:0:1", "1001:1001:64536"]
    x-podman.gidmaps: ["0:1:1000", "1000:0:1", "1001:1001:64536"]
    restart: unless-stopped